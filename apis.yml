name: BioAge Labs
description: BioAge Labs (Nasdaq ticker BIOA) is a clinical-stage biopharmaceutical company based in Emeryville,
  California, developing therapies that target the biology of human aging to treat metabolic diseases such
  as obesity and its related conditions. Its proprietary discovery platform mines longitudinal human
  multi-omics data to identify aging-related molecular pathways, which feed a therapeutic pipeline that
  includes BGE-102, an oral NLRP3 inhibitor aimed at chronic inflammation and cardiovascular risk, and an
  APJ (apelin receptor) agonist developed as an exercise mimetic for obesity. The company is backed by
  a16z and Redpoint Ventures and was added to the API Evangelist network as a portfolio-company profile.
  BioAge Labs publishes no public developer API, documentation, or SDK surface at this time; this profile
  captures its corporate and web-property identity plus a domain-security probe of its primary web host.
